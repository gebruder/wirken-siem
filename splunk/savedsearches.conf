[wirken_d1_shell_outbound_fetch]
search = `wirken_session_event` kind="assistant_tool_calls" \
  | `wirken_tool_calls` \
  | search call_name="exec" \
  | `wirken_argv_command(call_arguments)` \
  | `wirken_argv_first_token(argv_command)` \
  | search argv_first IN ("curl","wget","msiexec","invoke-webrequest","iwr","bitsadmin","certutil") \
  | rex field=argv_command "(?<url>https?://[^\s'\"<>]+)" \
  | rex field=url "https?://(?<url_host>[^/:?#]+)" \
  | table _time host session_id seq event.agent_id event.adapter_id event.sender_id call_id url_host url argv_command
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 3
alert.suppress = 0
#description = Detection 1: shell-driven outbound fetch. Fires when \
#  the agent runs curl / wget / msiexec / Invoke-WebRequest / iwr / \
#  bitsadmin / certutil through the exec tool.

[wirken_d2_exec_fork_pairing]
search = `wirken_session_event` \
  ( kind="assistant_tool_calls" OR kind="tool_result" ) \
  | `wirken_tool_calls` \
  | eval call_id = coalesce(call_id, 'event.call_id') \
  | eval tool_name = coalesce(call_name, 'event.tool_name') \
  | search tool_name="exec" \
  | transaction session_id call_id maxspan=10m \
  | eval duration_ms = duration*1000 \
  | eval output_size = if(isnotnull('event.output'), len('event.output'), 0) \
  | table _time session_id call_id event.agent_id event.adapter_id event.sender_id call_arguments event.success duration_ms output_size
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 1
#description = Detection 2: child process fork pairing. Joins \
#  AssistantToolCalls to its matching ToolResult by (session_id, \
#  call_id) over a 10m window. Surfaces duration and output size for \
#  follow-on long-running / failed splits.

[wirken_d2_exec_fork_pairing_long_running]
search = | savedsearch wirken_d2_exec_fork_pairing | search duration_ms > 30000
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 2
#description = Detection 2 subset: exec calls longer than 30s.

[wirken_d2_exec_fork_pairing_failed]
search = | savedsearch wirken_d2_exec_fork_pairing | search event.success="false"
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 2
#description = Detection 2 subset: exec calls that returned success=false.

[wirken_d3_binary_write]
search = `wirken_session_event` kind="assistant_tool_calls" \
  | `wirken_tool_calls` \
  | search call_name="write_file" \
  | spath input=call_arguments path=path output=file_path \
  | spath input=call_arguments path=content output=file_content \
  | rex field=file_path "\.(?<extension>exe|dll|so|dylib|msi|scr|bat|ps1|sh|cmd|com|vbs|jar)$" \
  | eval magic = case( \
      substr(file_content, 1, 2) == "MZ", "pe_or_ne", \
      substr(file_content, 1, 4) == "ELF", "elf_text_prefix", \
      true(), null() \
    ) \
  | where isnotnull(extension) OR isnotnull(magic) \
  | table _time session_id seq event.agent_id event.adapter_id event.sender_id call_id file_path extension magic
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 4
#description = Detection 3: binary write via write_file. Extension \
#  match runs against the full prefix list; content magic is a \
#  best-effort prefix check (Splunk's `substr` on UTF-8 strings \
#  misses several of the non-printable prefixes; webhook/rules.py \
#  carries the full set).

[wirken_d4_skill_dir_exec]
search = `wirken_session_event` kind="assistant_tool_calls" \
  | `wirken_tool_calls` \
  | search call_name="exec" \
  | `wirken_argv_command(call_arguments)` \
  | eval wirken_join = 1 \
  | join type=inner max=0 wirken_join [ \
      | inputlookup wirken_skill_dirs \
      | eval wirken_join = 1 \
      | rename prefix AS matched_skill_dir \
      | fields wirken_join matched_skill_dir \
    ] \
  | where like(argv_command, "%".matched_skill_dir."%") \
  | table _time session_id seq event.agent_id event.adapter_id event.sender_id call_id matched_skill_dir argv_command
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 4
#description = Detection 4: skill-dir-resident binary executed. \
#  Requires the `wirken_skill_dirs` lookup table populated with one \
#  prefix per row (column name `prefix`). An empty lookup makes the \
#  search return zero rows; operators see the gap in the README.

[wirken_d5_chain_tamper]
search = sourcetype="wirken:audit" action="audit.chain_broken" \
  | spath path=detail.session output=session_id \
  | `wirken_legacy_detail_field(seq)` \
  | `wirken_legacy_detail_field(expected_hash)` \
  | `wirken_legacy_detail_field(actual_hash)` \
  | `wirken_legacy_detail_field(verified_count)` \
  | join type=left session_id seq [ \
      search sourcetype="wirken:alarm-log" earliest=-20m latest=now \
      | eval alarm_time = _time \
      | table session_id seq alarm_time \
    ] \
  | eval alarm_delta_s = abs(alarm_time - _time) \
  | eval alarm_present = if(isnotnull(alarm_delta_s) AND alarm_delta_s <= 60, "yes", "no") \
  | eval severity = if(alarm_present="yes", "high", "critical") \
  | table _time host session_id seq expected_hash actual_hash verified_count alarm_present alarm_delta_s severity
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 5
#description = Detection 5: chain tamper correlation. Baseline high; \
#  promotes to critical when the alarm-log feed does not show a \
#  matching (session_id, seq) within +/-60s. The chain-broken row \
#  names its session as detail.session; the alarm log as session_id. \
#  Wire the alarm log to Splunk as a distinct sourcetype \
#  `wirken:alarm-log`; see README.

[wirken_d6_mcp_entry_refused]
search = `wirken_session_event` kind="mcp_entry_refused" \
  | table _time session_id seq event.server_name event.reason
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 4
#description = Detection 6: MCP entry refused at proxy load. Fires \
#  on any McpEntryRefused row. `reason` is a closed-set snake_case \
#  label (signature_invalid / unsigned / signer_key_missing / \
#  signer_key_decode_failed / delegation_required). Any hit means \
#  the MCP client never spawned; investigate which mcp.json entry \
#  failed and why.

[wirken_d7_hook_refused]
search = `wirken_session_event` kind="hook_dispatched" \
  | search event.decision.kind IN ("deny","timeout") \
  | table _time session_id seq event.agent_id event.adapter_id event.sender_id event.hook_id event.tool_name event.decision.kind event.decision.reason
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 3
#description = Detection 7: veto hook denied or timed out. Fires on \
#  HookDispatched rows whose decision.kind is deny or timeout. \
#  Timeout is fail-closed in production (the tool call is refused); \
#  it lands on the chain so reviewers distinguish timeout from \
#  explicit deny.

[wirken_d8_tool_output_redacted]
search = `wirken_session_event` kind="tool_output_redacted" \
  | table _time session_id seq event.agent_id event.adapter_id event.sender_id event.call_id event.hook_id event.reason event.original_sha256 event.original_size event.redacted_sha256 event.redacted_size
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 3
#description = Detection 8: tool output redacted by egress hook. \
#  Fires on any ToolOutputRedacted row. Plaintext is not on the \
#  chain by design; original_sha256 is the only on-chain reference \
#  to the bytes the tool produced.

[wirken_d9_agent_cost_anomaly]
search = `wirken_session_event` kind="llm_response" \
  | `wirken_llm_cost_micros` \
  | where isnotnull(cost_micros) \
  | eval agent_id = 'event.agent_id' \
  | bin _time span=1h \
  | stats sum(cost_micros) as bucket_micros by _time agent_id \
  | eventstats max(_time) as latest_hour \
  | eval is_current = if(_time==latest_hour, 1, 0) \
  | eventstats avg(eval(if(is_current==0, bucket_micros, null()))) as baseline_micros, \
      count(eval(if(is_current==0, bucket_micros, null()))) as baseline_buckets by agent_id \
  | where is_current==1 \
  | eval multiplier = 3 \
  | eval min_baseline_buckets = 24 \
  | where baseline_buckets >= min_baseline_buckets AND baseline_micros > 0 \
      AND bucket_micros > (multiplier * baseline_micros) \
  | eval recent_usd = round(bucket_micros / 1000000.0, 4), \
      baseline_usd = round(baseline_micros / 1000000.0, 4), \
      breach_ratio = round(bucket_micros / baseline_micros, 2) \
  | table _time agent_id recent_usd baseline_usd breach_ratio multiplier baseline_buckets
dispatch.earliest_time = -7d@h
dispatch.latest_time = @h
enableSched = 1
cron_schedule = 5 * * * *
alert.severity = 3
alert.suppress = 0
#description = Detection 9: per-agent LLM cost anomaly. Buckets \
#  llm_response cost into 1h windows per agent_id, compares the most \
#  recent complete hour to that agent's mean hourly spend over the \
#  trailing 7 days, and fires when the recent hour exceeds \
#  multiplier * baseline. Reads total_cost_usd_micros via the \
#  wirken_llm_cost_micros macro. Tunables and defaults: bin span=1h is \
#  the window and dispatch.earliest_time=-7d is the baseline lookback \
#  (1h catches a step change within an hour; 7d smooths daily and \
#  weekly cycles); multiplier=3 is the breach factor (3x normal spend \
#  is a clear step, not hour-to-hour variance); min_baseline_buckets=24 \
#  suppresses agents with under a day of history so a cold start does \
#  not false-positive. Requires audit schema 1.6.0+ cost fields and the \
#  LlmResponse forwarder opt-in.

[wirken_d10_budget_exceeded]
search = `wirken_session_event` kind="budget_exceeded" \
  | table _time session_id seq event.agent_id event.credential_id event.action event.window event.window_spend_usd_micros event.ceiling_usd_micros
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 3
alert.suppress = 0
#description = Detection 10: per-agent budget exceeded. Fires on any \
#  budget_exceeded row emitted by the wirken runtime's pre-call budget \
#  gate. action=blocked means the LLM call was refused (an enforced \
#  stop); action=alerted means the ceiling was crossed and the call \
#  proceeded. Requires audit schema 1.12.0 (the budget_exceeded event) \
#  and the default budget_exceeded forwarding.

[wirken_d11_exec_location_disagreement]
search = `wirken_session_event` kind="exec_location_disagreement" \
  | table _time session_id seq event.verified_session_id event.approval_seq event.result_seq event.told.mode event.told.text event.ran.mode event.ran.runtime event.agent_id event.adapter_id event.sender_id
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 4
alert.suppress = 0
#description = Detection 11: an exec approval prompt disagreed with \
#  where the command ran. Fires on any exec_location_disagreement row, \
#  which `wirken sessions verify` records on the gateway-verify lane \
#  when an approval's stated location (told) and the exec result's \
#  sandbox record (ran) differ in mode, or one says the host and the \
#  other a container. told.mode exec_only or gvisor with \
#  ran.runtime=host is a sandbox that failed open. Requires audit \
#  schema 1.28.0 and the default forwarding; appears only after \
#  verify has been run over the session.

[wirken_d12_binary_changed_outside_update]
search = sourcetype="wirken:audit" action="gateway.start" \
  | `wirken_legacy_detail_field(version)` \
  | `wirken_legacy_detail_field(commit)` \
  | `wirken_legacy_detail_field(dirty)` \
  | where isnotnull(version) \
  | join type=left host [ \
      search `wirken_session_event` kind="binary_installed" earliest=-1y latest=now \
      | stats latest(event.to_version) as installed_version latest(_time) as installed_time by host \
    ] \
  | where isnull(installed_time) OR installed_time <= _time \
  | eval finding = case(isnull(installed_time), "no_install_record", version!=installed_version, "version_differs", commit="unknown" OR dirty!="clean", "not_a_release_build", true(), null()) \
  | where isnotnull(finding) \
  | eval severity = if(finding="no_install_record", "informational", "high") \
  | table _time host version commit dirty installed_version installed_time finding severity
dispatch.earliest_time = -20m
dispatch.latest_time = -5m
enableSched = 1
cron_schedule = */15 * * * *
alert.severity = 4
alert.suppress = 0
#description = Detection 12: binary changed outside wirken update. \
#  Compares each gateway.start row's detail version with the to_version \
#  of the most recent binary_installed row from the same host. \
#  finding=version_differs or not_a_release_build (commit unknown or a \
#  tree that was not clean; a release binary is neither) is high. \
#  finding=no_install_record is informational: installs through \
#  install.sh and source builds leave no binary_installed row, so a \
#  missing row is not evidence of tampering. binary_installed carries \
#  no commit, so the commit is checked for release provenance rather \
#  than compared. The window ends 5m back because binary_installed \
#  reaches the typed pipe after the restart that follows it. Host is \
#  the install key. Requires audit schema 2.3.0; gateway.start rows \
#  from older binaries name no build and are skipped.

[wirken_d13_downgrade_or_rollback]
search = `wirken_session_event` kind="binary_installed" \
  | eval from_v = split('event.from_version', "."), to_v = split('event.to_version', ".") \
  | eval from_n = tonumber(mvindex(from_v, 0)) * 1000000 + tonumber(mvindex(from_v, 1)) * 1000 + tonumber(mvindex(from_v, 2)) \
  | eval to_n = tonumber(mvindex(to_v, 0)) * 1000000 + tonumber(mvindex(to_v, 1)) * 1000 + tonumber(mvindex(to_v, 2)) \
  | where 'event.rollback'="true" OR to_n < from_n \
  | eval finding = if('event.rollback'="true", "rollback", "downgrade") \
  | table _time host session_id seq event.from_version event.to_version event.rollback event.binary_sha256 event.target event.verifying_key finding
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.severity = 3
alert.suppress = 0
#description = Detection 13: downgrade or rollback. Fires on a \
#  binary_installed row with rollback=true (wirken update --rollback) \
#  or a to_version lower than from_version (wirken update \
#  --allow-downgrade). A downgrade can reinstate fixed vulnerabilities. \
#  Requires audit schema 2.3.0 and the default binary_installed \
#  forwarding.
