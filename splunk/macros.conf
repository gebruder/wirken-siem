[wirken_session_event]
definition = sourcetype="wirken:session"
#iseval = 0
#description = Typed SessionEvent rows. HEC indexes the object the \
#  Wirken forwarder sends as `event`, so a row's own fields are \
#  top level (`kind`, `level`, `session_id`, `seq`, `trust`) and the \
#  SessionEvent payload's are under `event.` (`event.agent_id`, \
#  `event.calls{}.name`, ...). No pipe in the definition, so search \
#  terms written after the macro filter rows.

[wirken_argv_command(1)]
args = field
definition = spath input=$field$ path=command output=argv_command
#description = Parse a tool-call `arguments` JSON string and extract \
#  the `command` field. Apply to `call_arguments` after \
#  `wirken_tool_calls`.

[wirken_argv_first_token(1)]
args = field
definition = eval argv_first = lower(replace(mvindex(split(trim($field$), " "), 0), ".*/", ""))
#description = Canonicalised first token of an argv string: strips \
#  any path component and lowercases. Matches the wirken-side \
#  `canonical_exec_prefix` so a saved search on `argv_first IN \
#  ("curl","wget",...)` catches `/usr/bin/CURL` too.

[wirken_legacy_detail_field(1)]
args = path
definition = spath path=detail.$path$ output=$path$
#description = Extract a named field out of the legacy AuditEvent \
#  `detail` object, which HEC indexes as `detail.<field>` with no \
#  `detail` field of its own. Used by Detections 5 and 12.

[wirken_llm_cost_micros]
definition = eval cost_micros = 'event.total_cost_usd_micros'
#description = Per-call LLM cost in USD micros for an llm_response row. \
#  Reads the precomputed total_cost_usd_micros the forwarder emits, not \
#  input+output summed: the total is computed once at emit time from the \
#  baked pricing table and is null exactly when either operand is null, \
#  so summing would only ever match the total or null-propagate. Rows \
#  with no cost (provider/model absent from the pricing table) carry no \
#  total; a following `where isnotnull(cost_micros)` drops them. Used by \
#  Detection 9.

[wirken_tool_calls]
definition = spath path=event.calls{} output=call \
  | mvexpand call \
  | spath input=call path=id output=call_id \
  | spath input=call path=name output=call_name \
  | spath input=call path=arguments output=call_arguments
#description = One row per tool call of an assistant_tool_calls row, \
#  with `call_id`, `call_name` and `call_arguments` (the arguments \
#  JSON string). Rows without calls pass through unchanged. Used by \
#  Detections 1-4.
